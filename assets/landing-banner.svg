<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">The Devil Is in the Interface</title>
  <desc id="desc">Six tool architectures across three actor models: BashOnly, Atomic, NLSearch, Python, HypoTrack, and ScratchPad. A study of consistency, exploration, and efficiency.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1728"/>
      <stop offset="1" stop-color="#182d46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9cb0cc" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="22" fill="url(#background)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect x="52" y="50" width="36" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="101" y="58" fill="#9db4ce" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">CODING AGENT TOOL ARCHITECTURE</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="143" fill="#f4f8ff" font-size="61" font-weight="700" letter-spacing="-1.8">The devil is in</text>
    <text x="52" y="211" fill="#f4f8ff" font-size="61" font-weight="700" letter-spacing="-1.8">the interface.</text>
    <text x="55" y="261" fill="#b7c9dd" font-size="22">How tool architecture shapes coding agents</text>
    <text x="55" y="309" fill="#7fe3d6" font-size="15" font-weight="700">CONSISTENCY</text>
    <circle cx="189" cy="304" r="2.5" fill="#60839e"/>
    <text x="205" y="309" fill="#a8b7fd" font-size="15" font-weight="700">EXPLORATION</text>
    <circle cx="342" cy="304" r="2.5" fill="#60839e"/>
    <text x="358" y="309" fill="#f5d8a0" font-size="15" font-weight="700">EFFICIENCY</text>
    <text x="55" y="369" fill="#8fa8c3" font-size="14">RESEARCH CODE · TRAJECTORIES · REPRODUCIBLE RESULTS</text>
  </g>
  <path d="M 717 75 V 345" stroke="#496582" stroke-opacity="0.4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="758" y="72" fill="#a9c0d7" font-size="14" font-weight="700" letter-spacing="1.4">SIX INTERFACES · THREE ACTORS</text>
    <rect x="758" y="96" width="216" height="72" rx="12" fill="#21364b" stroke="#44627d"/>
    <text x="778" y="140" fill="#e3ebf6" font-family="monospace" font-size="18">&gt;_</text>
    <text x="819" y="139" fill="#eef4fc" font-size="20" font-weight="700">BashOnly</text>
    <rect x="990" y="96" width="236" height="72" rx="12" fill="#173c42" stroke="#4c9f9c"/>
    <rect x="1010" y="124" width="8" height="8" rx="2" fill="#7fe3d6"/>
    <rect x="1022" y="124" width="8" height="8" rx="2" fill="#7fe3d6"/>
    <rect x="1010" y="136" width="8" height="8" rx="2" fill="#7fe3d6"/>
    <rect x="1022" y="136" width="8" height="8" rx="2" fill="#7fe3d6"/>
    <text x="1050" y="139" fill="#c2fff0" font-size="20" font-weight="700">Atomic</text>
    <rect x="758" y="184" width="216" height="72" rx="12" fill="#303452" stroke="#707dbe"/>
    <circle cx="787" cy="216" r="8" stroke="#b5c0ff" stroke-width="2.5" fill="none"/>
    <path d="M 793 222 L 800 229" stroke="#b5c0ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="819" y="227" fill="#d6ddff" font-size="20" font-weight="700">NLSearch</text>
    <rect x="990" y="184" width="236" height="72" rx="12" fill="#453a2e" stroke="#a99068"/>
    <text x="1009" y="227" fill="#ffdfa3" font-family="monospace" font-size="19">{ }</text>
    <text x="1050" y="227" fill="#ffdfa3" font-size="20" font-weight="700">Python</text>
    <rect x="758" y="272" width="216" height="72" rx="12" fill="#23334b" stroke="#4b6286"/>
    <path d="M 779 302 L 786 309 L 799 295 M 779 320 H 799" fill="none" stroke="#a9c5e7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="819" y="315" fill="#d6e5f8" font-size="20" font-weight="700">HypoTrack</text>
    <rect x="990" y="272" width="236" height="72" rx="12" fill="#23334b" stroke="#4b6286"/>
    <path d="M 1012 296 H 1030 M 1012 306 H 1030 M 1012 316 H 1025" stroke="#a9c5e7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1050" y="315" fill="#d6e5f8" font-size="20" font-weight="700">ScratchPad</text>
    <text x="758" y="377" fill="#8fa8c3" font-size="13">Qwen3Coder-30B · Kimi-K2.5 · Sonnet-4.5</text>
  </g>
</svg>
