[project]
name = "simple-agent"
version = "0.1.0"
description = "Python interface agent for the tool architecture study"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["openai>=1.86.0", "pyyaml>=6.0.0"]

[project.optional-dependencies]
evaluation = ["datasets==4.0.0", "docker>=7.1.0", "tiktoken==0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_agent"]
